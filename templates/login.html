<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>
   <div class="orbit-bg">

    <div class="orbit-glow"></div>

    <div id="particleField" class="particle-field"></div>

    <div class="orbit-ring ring-outer"></div>
    <div class="orbit-ring ring-inner"></div>

    <!-- OUTER STAGE -->
    <div class="orbit-stage stage-outer">

        <div class="orbit-lock">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="4" y="11" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
                <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.6"/>
                <circle cx="12" cy="16" r="1.6" fill="currentColor"/>
            </svg>
        </div>

        <div class="orbit-item" style="--angle: 0deg;">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M21 15l-5-5-9 9" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>

        <div class="orbit-item" style="--angle: 90deg;">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>

        <div class="orbit-item" style="--angle: 180deg;">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 18a4 4 0 0 1-1-7.9A5 5 0 0 1 15.5 9a4.5 4.5 0 0 1 1.5 8.7" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>

        <div class="orbit-item" style="--angle: 270deg;">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l7 3v6c0 5-3 8-7 11-4-3-7-6-7-11V5l7-3z" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>

    </div>

    <!-- INNER STAGE (opposite direction, smaller radius) -->
    <div class="orbit-stage stage-inner">

        <div class="orbit-item small" style="--angle: 45deg;">
            <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M21 15l-5-5-9 9" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>

        <div class="orbit-item small" style="--angle: 135deg;">
            <svg viewBox="0 0 24 24" fill="none"><path d="M7 18a4 4 0 0 1-1-7.9A5 5 0 0 1 15.5 9a4.5 4.5 0 0 1 1.5 8.7" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>

        <div class="orbit-item small" style="--angle: 225deg;">
            <svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>

        <div class="orbit-item small" style="--angle: 315deg;">
            <svg viewBox="0 0 24 24" fill="none"><path d="M12 2l7 3v6c0 5-3 8-7 11-4-3-7-6-7-11V5l7-3z" stroke="currentColor" stroke-width="1.5"/></svg>
        </div>

    </div>

</div>
</div>
<script>
    (function () {
        const field = document.getElementById("particleField");
    const count = 45;

    for (let i = 0; i < count; i++) {
            const dot = document.createElement("div");
    dot.className = "particle-dot";

    dot.style.left = Math.random() * 100 + "vw";
    dot.style.top = Math.random() * 100 + "vh";
    dot.style.animationDuration = (8 + Math.random() * 10) + "s";
    dot.style.animationDelay = (Math.random() * 8) + "s";
    dot.style.width = dot.style.height = (2 + Math.random() * 3) + "px";

    field.appendChild(dot);
        }
    })();
</script>
    <script>
    (function () {
        const savedTheme = localStorage.getItem("vaultTheme");
        if (savedTheme === "terminal") {
            document.body.setAttribute("data-theme", "terminal");
        }
    })();
</script>

    <div class="container">

        <h1>WELCOME BACK</h1>

<form action="/login" method="POST">

    <label for="username">
        <b>Username:</b>
    </label>

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Username"
        required
    >

    <br>

    <label for="password">
        <b>Password:</b>
    </label>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required
    >

    <br>

    <button type="submit" class="login">
        Login
    </button>

</form>
    </div>

</body>

</html>
