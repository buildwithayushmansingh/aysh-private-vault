<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='login.css') }}">

</head>

<body>

    <div class="orbit-bg">
        <!-- (your existing orbit background markup stays exactly as-is) -->
        <div class="orbit-glow"></div>
        <div id="particleField" class="particle-field"></div>
        <div class="orbit-ring ring-outer"></div>
        <div class="orbit-ring ring-inner"></div>

        <div class="orbit-stage stage-outer">
            <div class="orbit-lock">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="4" y="11" width="16" height="10" rx="2" stroke="currentColor" stroke-width="1.6"/>
                    <path d="M8 11V7a4 4 0 0 1 8 0v4" stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="12" cy="16" r="1.6" fill="currentColor"/>
                </svg>
            </div>
            <div class="orbit-item" style="--angle: 0deg;"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M21 15l-5-5-9 9" stroke="currentColor" stroke-width="1.5"/></svg></div>
            <div class="orbit-item" style="--angle: 90deg;"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="currentColor" stroke-width="1.5"/></svg></div>
            <div class="orbit-item" style="--angle: 180deg;"><svg viewBox="0 0 24 24" fill="none"><path d="M7 18a4 4 0 0 1-1-7.9A5 5 0 0 1 15.5 9a4.5 4.5 0 0 1 1.5 8.7" stroke="currentColor" stroke-width="1.5"/></svg></div>
            <div class="orbit-item" style="--angle: 270deg;"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l7 3v6c0 5-3 8-7 11-4-3-7-6-7-11V5l7-3z" stroke="currentColor" stroke-width="1.5"/></svg></div>
        </div>

        <div class="orbit-stage stage-inner">
            <div class="orbit-item small" style="--angle: 45deg;"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="4" width="18" height="16" rx="2" stroke="currentColor" stroke-width="1.5"/><circle cx="8.5" cy="9.5" r="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M21 15l-5-5-9 9" stroke="currentColor" stroke-width="1.5"/></svg></div>
            <div class="orbit-item small" style="--angle: 135deg;"><svg viewBox="0 0 24 24" fill="none"><path d="M7 18a4 4 0 0 1-1-7.9A5 5 0 0 1 15.5 9a4.5 4.5 0 0 1 1.5 8.7" stroke="currentColor" stroke-width="1.5"/></svg></div>
            <div class="orbit-item small" style="--angle: 225deg;"><svg viewBox="0 0 24 24" fill="none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z" stroke="currentColor" stroke-width="1.5"/></svg></div>
            <div class="orbit-item small" style="--angle: 315deg;"><svg viewBox="0 0 24 24" fill="none"><path d="M12 2l7 3v6c0 5-3 8-7 11-4-3-7-6-7-11V5l7-3z" stroke="currentColor" stroke-width="1.5"/></svg></div>
        </div>
    </div>

    <div class="container" id="loginCard">

        <h1>WELCOME BACK</h1>

        <form id="loginForm">

            <label class="username">Username:</label>
            <input type="text" name="username" id="usernameInput" placeholder="Username" required>

            <label class="password">Password:</label>
            <input type="password" name="password" id="passwordInput" placeholder="Password" required>

            <input type="text" name="display_name" id="displayNameInput" placeholder="Your name (optional)">

            <div id="loginError" class="login-error" style="display:none;"></div>

            <button type="submit" class="login" id="loginButton">
                Login
            </button>

        </form>

    </div>


    <!-- =========================
         CINEMATIC LOGIN TRANSITION
    ========================= -->

    <div id="loginTransition" class="login-transition">
        <canvas id="transitionCanvas"></canvas>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        (function () {
            const field = document.getElementById("particleField");
            const count = 45;
            for (let i = 0; i < count; i++) {
                const dot = document.createElement("div");
                dot.className = "particle-dot";
                dot.style.left = Math.random() * 100 + "vw";
                dot.style.top = Math.random() * 100 + "vh";
                dot.style.animationDuration = (8 + Math.random() * 10) + "s";
                dot.style.animationDelay = (Math.random() * 8) + "s";
                dot.style.width = dot.style.height = (2 + Math.random() * 3) + "px";
                field.appendChild(dot);
            }
        })();
    </script>

    <script>
        (function () {
            const savedTheme = localStorage.getItem("vaultTheme");
            if (savedTheme === "terminal") {
                document.body.setAttribute("data-theme", "terminal");
            }
        })();
    </script>


    <!-- =========================
         LOGIN + CINEMATIC TRANSITION LOGIC
    ========================= -->

    <script>
        (function () {

            const form = document.getElementById("loginForm");
            const loginButton = document.getElementById("loginButton");
            const loginCard = document.getElementById("loginCard");
            const errorBox = document.getElementById("loginError");
            const transitionEl = document.getElementById("loginTransition");
            const canvas = document.getElementById("transitionCanvas");

            let isSubmitting = false;

            function getThemeColors() {

                const styles = getComputedStyle(document.body);

                return {
                    bg: styles.getPropertyValue("--bg-color").trim() || "#070b1f",
                    accent: styles.getPropertyValue("--accent").trim() || "#7185ff",
                };
            }

            function hexToThreeColor(hex) {
                return new THREE.Color(hex);
            }

            form.addEventListener("submit", async function (event) {

                event.preventDefault();

                if (isSubmitting) return;

                isSubmitting = true;
                loginButton.disabled = true;

                errorBox.style.display = "none";

                const username = document.getElementById("usernameInput").value;
                const password = document.getElementById("passwordInput").value;
                const displayName = document.getElementById("displayNameInput").value;

                try {

                    const response = await fetch("/api/login", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ username, password, display_name: displayName })
                    });

                    const data = await response.json();

                    if (data.success) {
                        runCinematicTransition();
                    } else {
                        errorBox.textContent = data.error || "Wrong username or password";
                        errorBox.style.display = "block";
                        isSubmitting = false;
                        loginButton.disabled = false;
                    }

                } catch (error) {

                    console.log("Login error:", error);
                    errorBox.textContent = "Something went wrong. Please try again.";
                    errorBox.style.display = "block";
                    isSubmitting = false;
                    loginButton.disabled = false;

                }
            });

                        function runCinematicTransition() {

                const colors = getThemeColors();

                document.body.style.background = colors.bg;

                transitionEl.style.background = colors.bg;
                transitionEl.style.display = "block";

                loginCard.style.transition = "opacity 0.5s ease, transform 0.5s ease";
                loginCard.style.opacity = "0";
                loginCard.style.transform = "scale(1.08)";

                requestAnimationFrame(function () {
                    transitionEl.style.transition = "opacity 0.4s ease";
                    transitionEl.style.opacity = "1";
                });

                // ============ THREE.JS SETUP ============

                const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
                renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                renderer.setSize(window.innerWidth, window.innerHeight);

                const scene = new THREE.Scene();

                const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 2000);
                camera.position.z = 5;

                const accentColor = hexToThreeColor(colors.accent);
                const whiteColor = new THREE.Color(0xffffff);

                // ============ SPIRAL PARTICLE FIELD ============
                // Stored in polar form (radius + angle) per particle so we
                // can swirl them around the z-axis each frame - this is what
                // gives the "flying into a rotating vortex" feel instead of
                // a flat straight-line rush.

                const particleCount = window.innerWidth < 700 ? 1400 : 3000;

                const radius = new Float32Array(particleCount);
                const angle = new Float32Array(particleCount);
                const zPos = new Float32Array(particleCount);
                const speeds = new Float32Array(particleCount);
                const colorMix = new Float32Array(particleCount);

                const positions = new Float32Array(particleCount * 3);
                const colorsAttr = new Float32Array(particleCount * 3);

                for (let i = 0; i < particleCount; i++) {

                    radius[i] = 1.5 + Math.random() * 22;
                    angle[i] = Math.random() * Math.PI * 2;
                    zPos[i] = (Math.random() - 0.5) * 500;
                    speeds[i] = 0.5 + Math.random() * 1.6;
                    colorMix[i] = Math.random();

                    const mixed = accentColor.clone().lerp(whiteColor, colorMix[i] * 0.5);

                    colorsAttr[i * 3] = mixed.r;
                    colorsAttr[i * 3 + 1] = mixed.g;
                    colorsAttr[i * 3 + 2] = mixed.b;
                }

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute("color", new THREE.BufferAttribute(colorsAttr, 3));

                const material = new THREE.PointsMaterial({
                    size: 1.7,
                    vertexColors: true,
                    transparent: true,
                    opacity: 0.9,
                    blending: THREE.AdditiveBlending,
                    depthWrite: false
                });

                const particles = new THREE.Points(geometry, material);
                scene.add(particles);

                // ============ ROTATING VORTEX RING ============
                // A glowing torus the camera flies through partway
                // through the animation - a distinct focal moment.

                const ringGeo = new THREE.TorusGeometry(9, 0.06, 16, 100);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: accentColor,
                    transparent: true,
                    opacity: 0
                });
                const vortexRing = new THREE.Mesh(ringGeo, ringMat);
                vortexRing.position.z = -60;
                scene.add(vortexRing);

                const ringGeo2 = new THREE.TorusGeometry(5, 0.045, 16, 100);
                const ringMat2 = new THREE.MeshBasicMaterial({
                    color: whiteColor,
                    transparent: true,
                    opacity: 0
                });
                const vortexRing2 = new THREE.Mesh(ringGeo2, ringMat2);
                vortexRing2.position.z = -110;
                scene.add(vortexRing2);

                // Thin glowing data lines for the later phase
                const lineGroup = new THREE.Group();

                for (let i = 0; i < 14; i++) {

                    const lineGeo = new THREE.BufferGeometry();

                    const y = (Math.random() - 0.5) * 30;
                    const z = -Math.random() * 200;

                    const pts = new Float32Array([-30, y, z, 30, y, z]);

                    lineGeo.setAttribute("position", new THREE.BufferAttribute(pts, 3));

                    const lineMat = new THREE.LineBasicMaterial({
                        color: accentColor,
                        transparent: true,
                        opacity: 0
                    });

                    lineGroup.add(new THREE.Line(lineGeo, lineMat));
                }

                scene.add(lineGroup);

                function onResize() {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                }

                window.addEventListener("resize", onResize);

                // ============ TIMELINE (4.5 seconds total) ============

                const startTime = performance.now();
                const TOTAL_MS = 2500;

                function easeInOutCubic(t) {
                    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                }

                function animate(now) {

                    const elapsed = now - startTime;

                    let speedMultiplier = 1;
                    let swirlSpeed = 0.004;

                    if (elapsed < 400) {

                        // Phase 1: gentle pull in, swirl just starting
                        const t = easeInOutCubic(elapsed / 400);
                        speedMultiplier = t * 1.5;
                        swirlSpeed = 0.01 + t * 0.02;

                    } else if (elapsed < 1250) {

                        // Phase 2: full warp, spiral tightens and accelerates
                        const t = easeInOutCubic((elapsed - 400) / 850);
                        speedMultiplier = 1.5 + t * 4;
                        swirlSpeed = 0.03 + t * 0.06;

                    } else if (elapsed < 2000) {

                        // Phase 3: eases down into the data environment, ring flythrough
                        const t = easeInOutCubic((elapsed - 1250) / 750);
                        speedMultiplier = 5.5 - t * 3.5;
                        swirlSpeed = 0.09 - t * 0.06;

                    } else {

                        // Phase 4: rapid stabilize and fade
                        const t = easeInOutCubic((elapsed - 2000) / 500);
                        speedMultiplier = Math.max(2 * (1 - t), 0);
                        swirlSpeed = Math.max(0.03 * (1 - t), 0);
                    }

                    // Update spiral particle positions
                    const posAttr = particles.geometry.attributes.position;

                    for (let i = 0; i < particleCount; i++) {

                        angle[i] += swirlSpeed * (1 + (1 - Math.min(radius[i] / 24, 1)) * 1.5);
                        zPos[i] += speeds[i] * speedMultiplier;

                        if (zPos[i] > 20) {
                            zPos[i] = -500;
                            radius[i] = 1.5 + Math.random() * 22;
                        }

                        const r = radius[i];

                        posAttr.array[i * 3] = r * Math.cos(angle[i]);
                        posAttr.array[i * 3 + 1] = r * Math.sin(angle[i]);
                        posAttr.array[i * 3 + 2] = zPos[i];
                    }

                    posAttr.needsUpdate = true;

                    // Camera roll - the "rounding" feel as it travels
                    camera.rotation.z = Math.sin(elapsed / 1400) * 0.12 + (elapsed / TOTAL_MS) * 0.25;
                    camera.position.x = Math.sin(elapsed / 900) * 0.4;
                    camera.position.y = Math.cos(elapsed / 1100) * 0.3;

                    // Vortex ring flythrough - fades in, camera passes through it, fades out
                    if (elapsed > 900 && elapsed < 2600) {

                        const ringT = Math.min((elapsed - 900) / 500, 1);
                        ringMat.opacity = Math.min(ringT, 1) * 0.55;
                        ringMat2.opacity = Math.min(ringT, 1) * 0.4;

                        vortexRing.position.z += 0.09 * speedMultiplier;
                        vortexRing2.position.z += 0.09 * speedMultiplier;
                        vortexRing.rotation.z += 0.01;
                        vortexRing2.rotation.z -= 0.014;

                        if (vortexRing.position.z > 12) {
                            ringMat.opacity *= 0.9;
                            ringMat2.opacity *= 0.9;
                        }

                    } else if (elapsed >= 2600) {

                        ringMat.opacity = Math.max(ringMat.opacity - 0.03, 0);
                        ringMat2.opacity = Math.max(ringMat2.opacity - 0.03, 0);
                    }

                    // Data lines fade in during phase 3
                    if (elapsed > 2250 && elapsed < 3800) {

                        const lineT = Math.min((elapsed - 2250) / 500, 1);

                        lineGroup.children.forEach(function (line) {
                            line.material.opacity = lineT * 0.3;
                        });

                    } else if (elapsed >= 3800) {

                        lineGroup.children.forEach(function (line) {
                            line.material.opacity = Math.max(line.material.opacity - 0.03, 0);
                        });
                    }

                    // Final fade out
                    if (elapsed > 3600) {

                        const fadeT = Math.min((elapsed - 3600) / 900, 1);

                        material.opacity = Math.max(0.9 * (1 - fadeT), 0);
                        renderer.domElement.style.opacity = String(1 - fadeT * 0.5);
                    }

                    renderer.render(scene, camera);

                    if (elapsed < TOTAL_MS) {
                        requestAnimationFrame(animate);
                    } else {
                        finishTransition();
                    }
                }

                requestAnimationFrame(animate);
            }
            function finishTransition() {
                // Navigate now - background colors already match,
                // so this handoff reads as seamless rather than a reload.
                window.location.href = "/home";
            }

        })();
    </script>

</body>

</html>
