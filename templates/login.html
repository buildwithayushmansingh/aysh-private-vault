<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

    <div class="container">

        <h1>WELCOME BACK</h1>

<form action="/login" method="POST">

    <label for="username">
        <b>Username:</b>
    </label>

    <input
        type="text"
        id="username"
        name="username"
        placeholder="Username"
        required
    >

    <br>

    <label for="password">
        <b>Password:</b>
    </label>

    <input
        type="password"
        id="password"
        name="password"
        placeholder="Password"
        required
    >

    <br>

    <button type="submit" class="login">
        Login
    </button>

</form>
    </div>

</body>

</html>
