<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
</head>

<body>

    <div class="container">

        <h1>WELCOME BACK</h1>

        <form action="/login" method="POST">

            <!-- Username -->
            <label for="username">
                <b class="username">Username:</b>
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Username"
                required
            >

            <br>


            <!-- Password -->
            <label for="password">
                <b class="password">Password:</b>
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Password"
                required
            >

            <br>


            <!-- Remember Me -->
            <input
                type="checkbox"
                class="check"
                id="remember"
            >

            <label for="remember" class="remember">
                Remember me
            </label>


            <!-- Forgot Password -->
            <p class="forget-password">
                Forgot password?
            </p>

            <br>


            <!-- Login Button -->
            <button
                type="submit"
                class="login"
            >
                Login
            </button>

        </form>

    </div>

</body>

</html>
