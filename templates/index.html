<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Private Gallery</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">

        <div class="logo">
            🔐 Private Vault
        </div>

        <div class="navbar-right">

            <button class="theme-toggle" onclick="toggleTheme()" id="themeToggleBtn">
                🖥️ Terminal Mode
            </button>

            <a href="/logout" class="logout">
                Logout
            </a>

        </div>

    </header>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="gallery-container">

        <div class="gallery-header">

            <div>

                <h1>
                    My Private Gallery
                </h1>

                <p>
                    Your shared private photo collection.
                </p>

            </div>


            <!-- =========================
                 ADD PHOTO
            ========================= -->

            <form
                action="/upload"
                method="POST"
                enctype="multipart/form-data"
                class="upload-form"
            >

                <input
                    type="file"
                    id="photo"
                    name="photo"
                    accept="image/*"
                    required
                >

                <button
                    type="submit"
                    class="upload-button"
                >
                    Upload Photo
                </button>

            </form>

        </div>


        <!-- =========================
             GALLERY
        ========================= -->

        <div class="gallery">

    {% for photo in photos %}

    <div class="photo-card">

        <img
            src="{{ photo.url }}"
            alt="Private Picture"
            class="gallery-image"
            onclick="openImage(this)"
        >

        <div class="photo-info">

            <span title="{{ photo.filename }}">
                {{ photo.filename }}
            </span>

            <div class="photo-menu">

                <button
                    type="button"
                    class="menu-button"
                    onclick="toggleMenu(this)"
                >
                    ⋮
                </button>

                <div class="menu-dropdown">

                    <!-- DOWNLOAD -->

                    
                        href="{{ photo.url.replace('/upload/', '/upload/fl_attachment/') }}"
                        class="download-link"
                        download
                    >
                        Download
                    </a>

                    <!-- RENAME -->

                    <form
                        action="/rename"
                        method="POST"
                        class="rename-form"
                    >

                        <input
                            type="hidden"
                            name="old_public_id"
                            value="{{ photo.public_id }}"
                        >

                        <input
                            type="text"
                            name="new_name"
                            placeholder="New name"
                            required
                        >

                        <button type="submit">
                            Rename
                        </button>

                    </form>


                    <!-- DELETE -->

                    <form
                        action="/delete"
                        method="POST"
                        onsubmit="return confirm('Delete this photo?');"
                    >

                        <input
                            type="hidden"
                            name="public_id"
                            value="{{ photo.public_id }}"
                        >

                        <button type="submit">
                            Delete
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    {% endfor %}

</div>
    </main>


    <!-- =========================
         FULL SCREEN IMAGE
    ========================= -->

    <div
        id="imageModal"
        class="image-modal"
        onclick="closeImage()"
    >

        <span class="close-image">
            &times;
        </span>

        <img
            id="bigImage"
            class="big-image"
        >

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
