<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Private Vault</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body class="vault-page">

    <!-- =========================
         FLOATING DOCK HEADER (DESKTOP)
    ========================= -->

    <header class="vault-dock">

        <div class="vault-dock-inner">

            <div class="vault-logo">
                <span class="vault-logo-dot"></span>
                VAULT
            </div>

            <nav class="vault-dock-nav" id="dockNav">

                <span class="dock-pill" id="dockPill"></span>

                <a href="/home" class="dock-item active" data-nav>
                    <span class="dock-icon">🖼</span> Gallery
                </a>

                <a href="/chat" class="dock-item" data-nav>
                    <span class="dock-icon">💬</span> Chat
                </a>

                <a href="/security" class="dock-item" data-nav>
                    <span class="dock-icon">🛡</span> Security
                </a>

                <a href="/activity" class="dock-item" data-nav>
                    <span class="dock-icon">🕒</span> Activity
                </a>

                <a href="/storage" class="dock-item" data-nav>
                    <span class="dock-icon">📊</span> Storage
                </a>

            </nav>

            <div class="vault-dock-actions">

                <button
                    class="dock-icon-btn"
                    onclick="toggleTheme()"
                    id="themeToggleBtn"
                    type="button"
                    title="Toggle theme"
                >
                    🖥
                </button>

                <button
                    class="dock-fab"
                    type="button"
                    onclick="document.getElementById('hiddenUploadInput').click()"
                    title="Add photo"
                >
                    +
                </button>

                <a href="/logout" class="dock-icon-btn" title="Logout">⏻</a>

            </div>

        </div>


        <div class="vault-filter-row">

            <button class="filter-tab active" data-filter="all" onclick="setGalleryFilter('all', this)">All</button>
            <button class="filter-tab" data-filter="recent" onclick="setGalleryFilter('recent', this)">Recent</button>
            <button class="filter-tab" data-filter="favorites" onclick="setGalleryFilter('favorites', this)">Favorites</button>

        </div>

    </header>


    <!-- =========================
         HIDDEN UPLOAD FORM
    ========================= -->

    <form
        id="uploadForm"
        action="/upload"
        method="POST"
        enctype="multipart/form-data"
        style="display:none;"
    >

        <input
            type="file"
            id="hiddenUploadInput"
            name="photo"
            accept="image/*"
            onchange="document.getElementById('uploadForm').submit();"
        >

    </form>


    <!-- =========================
         GALLERY
    ========================= -->

    <main class="vault-gallery-wrap">

        {% if photos %}

        <div class="vault-gallery" id="vaultGallery">

            {% for photo in photos %}

            <div class="vault-item" data-index="{{ loop.index0 }}" data-public-id="{{ photo.public_id }}">

    <button
        type="button"
        class="vault-favorite-btn {{ 'active' if photo.public_id in favorites else '' }}"
        onclick="event.stopPropagation(); toggleFavorite(this, '{{ photo.public_id }}')"
    >
        ♥
    </button>

    <div class="vault-item-inner" onclick="openViewer({{ loop.index0 }})">

                    <img
                        src="{{ photo.url }}"
                        alt="{{ photo.filename }}"
                        loading="lazy"
                    >

                    <div class="vault-overlay">
                        <span class="vault-filename">{{ photo.filename }}</span>
                        <span class="vault-view">View</span>
                    </div>

                </div>

                <div class="vault-menu">

                    <button
                        type="button"
                        class="vault-menu-btn"
                        onclick="event.stopPropagation(); toggleVaultMenu(this)"
                    >
                        ⋯
                    </button>

                    <div class="vault-menu-dropdown" onclick="event.stopPropagation()">

                        <form
                            action="/rename"
                            method="POST"
                            class="vault-rename-form"
                        >

                            <input
                                type="hidden"
                                name="old_public_id"
                                value="{{ photo.public_id }}"
                            >

                            <input
                                type="text"
                                name="new_name"
                                placeholder="New name"
                                required
                            >

                            <button type="submit">Rename</button>

                        </form>

                        <form
                            action="/delete"
                            method="POST"
                            onsubmit="return confirm('Delete this photo?');"
                        >

                            <input
                                type="hidden"
                                name="public_id"
                                value="{{ photo.public_id }}"
                            >

                            <button type="submit">Delete</button>

                        </form>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

        {% else %}

        <div class="vault-empty">
            No photographs yet.
        </div>

        {% endif %}

    </main>


    <!-- =========================
         FULL SCREEN VIEWER
    ========================= -->

    <div class="vault-viewer" id="vaultViewer">

        <button class="viewer-close" onclick="closeViewer()">&times;</button>

        <button class="viewer-nav viewer-prev" onclick="viewerNav(-1)">&#8249;</button>

        <img class="viewer-image" id="viewerImage" src="" alt="">

        <button class="viewer-nav viewer-next" onclick="viewerNav(1)">&#8250;</button>

        <div class="viewer-caption">
            <span class="viewer-filename" id="viewerFilename"></span>
            <span class="viewer-counter" id="viewerCounter"></span>
        </div>

    </div>


    <!-- =========================
         FLOATING DOCK (MOBILE)
         Raised center FAB, floating pill shape.
    ========================= -->

    <nav class="vault-mobile-dock">

        <a href="/chat" class="mdock-item">
            <span class="mdock-icon">💬</span>
        </a>

        <a href="/security" class="mdock-item">
            <span class="mdock-icon">🛡</span>
        </a>

        <button
            class="mdock-fab"
            type="button"
            onclick="document.getElementById('hiddenUploadInput').click()"
        >
            +
        </button>

        <a href="/activity" class="mdock-item">
            <span class="mdock-icon">🕒</span>
        </a>

        <a href="/storage" class="mdock-item">
            <span class="mdock-icon">📊</span>
        </a>

    </nav>


    <!-- =========================
         PHOTO DATA FOR VIEWER/JS
    ========================= -->

    <script>
        const VAULT_PHOTOS = {{ photos | tojson }};
    </script>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
