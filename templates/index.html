<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Private Gallery</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->

    <header class="navbar">

        <div class="logo">
            🔐 Private Vault For Ayushman
        </div>

        <!-- PAGE TABS -->

   <nav class="page-nav">

    <a href="/home">Gallery</a>
    <a href="/chat">Chat</a>
    <a href="/security">Security</a>
    <a href="/activity">Activity</a>
    <a href="/storage">Storage</a>

</nav>

        <div class="navbar-right">

            <!-- THEME -->

            <button
                class="theme-toggle"
                onclick="toggleTheme()"
                id="themeToggleBtn"
                type="button"
            >
                🖥️ Terminal Mode
            </button>


            <!-- LOGOUT ALL DEVICES -->

            <form
                action="/logout-all"
                method="POST"
                onsubmit="return confirm('Logout from all devices?');"
            >

                <button
                    type="submit"
                    class="logout-all"
                >
                    Logout All Devices
                </button>

            </form>


            <!-- CURRENT DEVICE LOGOUT -->
            <a
            
                href="/logout"
                class="logout"
            >
                Logout
            </a>

        </div>

    </header>


    <!-- =========================
         WELCOME BANNER
    ========================= -->

    <div class="welcome-banner">
        Welcome, <strong>{{ identity_name }}</strong> 👋
    </div>


    <!-- =========================
         MAIN
    ========================= -->

    <main class="gallery-container">

        <!-- =========================
             HEADER
        ========================= -->

        <div class="gallery-header">

            <div>

                <h1>
                    My Private Gallery
                </h1>

                <p>
                    Your shared private photo collection.
                </p>

            </div>


            <!-- =========================
                 ADD PHOTO
            ========================= -->

            <form
                action="/upload"
                method="POST"
                enctype="multipart/form-data"
                class="upload-form"
            >

                <input
                    type="file"
                    id="photo"
                    name="photo"
                    accept="image/*"
                    required
                >

                <button
                    type="submit"
                    class="upload-button"
                >
                    Upload Photo
                </button>

            </form>

        </div>


        <!-- =========================
             GALLERY
        ========================= -->

        <div class="gallery">

            {% for photo in photos %}

            <div class="photo-card">

                <!-- PHOTO -->

                <img
                    src="{{ photo.url }}"
                    alt="Private Picture"
                    class="gallery-image"
                    onclick="openImage(this)"
                >


                <!-- PHOTO INFO -->

                <div class="photo-info">

                    <span title="{{ photo.filename }}">
                        {{ photo.filename }}
                    </span>


                    <!-- THREE DOT MENU -->

                    <div class="photo-menu">

                        <button
                            type="button"
                            class="menu-button"
                            onclick="toggleMenu(this)"
                        >
                            ⋮
                        </button>


                        <div class="menu-dropdown">


                            <!-- =====================
                                 DOWNLOAD
                            ====================== -->

                            <a
                                href="{{ photo.url.replace('/upload/', '/upload/fl_attachment/') }}"
                                class="download-link"
                            >
                                Download
                            </a>


                            <!-- =====================
                                 RENAME
                            ====================== -->

                            <form
                                action="/rename"
                                method="POST"
                                class="rename-form"
                            >

                                <input
                                    type="hidden"
                                    name="old_public_id"
                                    value="{{ photo.public_id }}"
                                >

                                <input
                                    type="text"
                                    name="new_name"
                                    placeholder="New name"
                                    required
                                >

                                <button
                                    type="submit"
                                >
                                    Rename
                                </button>

                            </form>


                            <!-- =====================
                                 DELETE
                            ====================== -->

                            <form
                                action="/delete"
                                method="POST"
                                onsubmit="return confirm('Delete this photo?');"
                            >

                                <input
                                    type="hidden"
                                    name="public_id"
                                    value="{{ photo.public_id }}"
                                >

                                <button
                                    type="submit"
                                >
                                    Delete
                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

            {% endfor %}

        </div>

    </main>


    <!-- =========================
         FULL SCREEN IMAGE
    ========================= -->

    <div
        id="imageModal"
        class="image-modal"
        onclick="closeImage()"
    >

        <span class="close-image">
            &times;
        </span>

        <img
            id="bigImage"
            class="big-image"
        >

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================= -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
